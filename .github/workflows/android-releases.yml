name: Android builds and releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Set beta version
        id: version
        shell: bash
        run: |
          base_version="$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -n 1)"
          base_version="${base_version%%-*}"
          beta_version="${base_version}-beta.${GITHUB_RUN_NUMBER}"
          echo "version=${beta_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${beta_version}" >> "$GITHUB_OUTPUT"

      - name: Configure Android release signing when available
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are not configured. The APK artifact will use the debug key and will not be published as a GitHub Release."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/streambox-release-key.jks
          cat > android/key.properties <<EOF
          storeFile=app/streambox-release-key.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build beta APKs
        env:
          BUILD_NAME: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p release-assets
          flutter build apk --release --split-per-abi --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-*-release.apk release-assets/
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/streambox-universal.apk

      - name: Upload beta build artifact
        uses: actions/upload-artifact@v4
        with:
          name: streambox-${{ steps.version.outputs.version }}-android-apks
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          change_notes="$(awk -v heading="### ${RELEASE_VERSION}" '$0 == heading { found=1; next } found && /^### / { exit } found { print }' CHANGELOG.md)"
          if [[ -z "${change_notes//[[:space:]]/}" ]]; then
            change_notes="See CHANGELOG.md for this beta's feature list."
          fi
          release_notes="$(printf '## Streambox Beta %s\n\nAndroid preview build.\n\n%s\n' "$RELEASE_VERSION" "$change_notes")"
          gh release create "$RELEASE_TAG" release-assets/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Streambox ${RELEASE_VERSION} (Beta)" \
            --notes "$release_notes" \
            --generate-notes \
            --prerelease

      - name: Explain debug-signed artifact
        if: steps.signing.outputs.configured != 'true'
        run: |
          echo "### Beta APK artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK was compiled and uploaded as a workflow artifact, signed with the Android debug key, because release signing secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          echo "It cannot update an APK signed with the persistent release key. Configure the existing release key in Actions Secrets before publishing an installable beta release." >> "$GITHUB_STEP_SUMMARY"

  stable:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate stable version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable tags must use vMAJOR.MINOR.PATCH (for example, v1.0.0)."
            exit 1
          fi

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/streambox-release-key.jks
          cat > android/key.properties <<EOF
          storeFile=app/streambox-release-key.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build stable APKs
        env:
          BUILD_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_NAME="${BUILD_NAME#v}"
          mkdir -p release-assets
          flutter build apk --release --split-per-abi --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-*-release.apk release-assets/
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/streambox-universal.apk

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          change_notes="$(awk -v heading="### ${release_version}" '$0 == heading { found=1; next } found && /^### / { exit } found { print }' CHANGELOG.md)"
          if [[ -z "${change_notes//[[:space:]]/}" ]]; then
            change_notes="See CHANGELOG.md for the stable release notes."
          fi
          release_notes="$(printf '## Streambox %s\n\nStable Android release.\n\n%s\n' "$GITHUB_REF_NAME" "$change_notes")"
          gh release create "$GITHUB_REF_NAME" release-assets/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Streambox $GITHUB_REF_NAME" \
            --notes "$release_notes" \
            --generate-notes

